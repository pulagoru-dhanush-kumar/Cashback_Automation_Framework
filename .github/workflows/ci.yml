name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: [self-hosted, Windows, X64]

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup Java 17
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3. Check environment
      - name: Check environment
        run: |
          java -version
          mvn -version
          node --version
          npm --version

      # 4. Build project without executing tests
      - name: Build with Maven
        run: mvn -B clean install -DskipTests

      # 5. Run tests with visible Playwright browser
      - name: Run tests with visible browser
        run: mvn -B test -Dheadless=false

      # 6. Upload screenshots
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-screenshots
          path: target/screenshots/*.png
          if-no-files-found: warn

      # 7. Upload Surefire reports
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      # 8. Upload Allure results
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
